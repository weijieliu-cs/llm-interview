name: Guide checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check documentation links and question index
        run: python tools/check_docs.py
      - name: Test interview exercises
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          python examples/attention.py
          python examples/retrieval_metrics.py
      - name: Check whitespace
        run: git show --format= --check HEAD
